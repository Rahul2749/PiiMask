name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Read and validate release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Expected a tag such as v0.1.0 or v0.2.0-preview.1"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet restore PiiMask.slnx
      - run: dotnet build PiiMask.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION"
      - run: dotnet test tests/PiiMask.Tests/PiiMask.Tests.csproj -c Release --no-build
      - run: dotnet pack src/PiiMask/PiiMask.csproj -c Release --no-build -p:Version="$PACKAGE_VERSION" -o artifacts
      - name: Verify package contents and symbols
        shell: pwsh
        run: ./scripts/Test-ReleasePackage.ps1 -PackageVersion $env:PACKAGE_VERSION
      - name: Test the examples shipped in the documentation
        shell: pwsh
        run: |
          ./scripts/Test-NuGetReadme.ps1 -PackageVersion $env:PACKAGE_VERSION
          ./scripts/Test-UsageGuide.ps1 -PackageVersion $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
  publish:
    needs: package
    # Enable this repository variable after configuring nuget/NUGET_API_KEY.
    if: ${{ vars.NUGET_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts
      - name: Push packages and symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Configure the nuget environment's NUGET_API_KEY secret before enabling automated publication."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
